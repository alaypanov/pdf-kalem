<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalem PDF Composer</title>
  <style>
    html,
    body,
    iframe {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }

    #app {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>

<body>
  <div id="app">
    <iframe id="pdf" frameborder="0" style="height:100%;width: 100%;"></iframe>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
